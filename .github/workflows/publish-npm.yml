name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish from (optional)
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@egym"
      - name: Verify requested tag
        if: github.event.inputs.tag != ''
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$REQUESTED_TAG" != "$version" ]]; then
            echo "Requested tag $REQUESTED_TAG does not match package version $version." >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run verify:lockfile
      - run: npm run build
      - run: npm publish --provenance --access public
