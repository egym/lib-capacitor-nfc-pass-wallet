name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish from (optional)
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          scope: "@egym"
      - name: Verify requested tag
        if: github.event.inputs.tag != ''
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$REQUESTED_TAG" != "$version" ]]; then
            echo "Requested tag $REQUESTED_TAG does not match package version $version." >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run verify:lockfile
      - run: npm run build
      - run: npm publish --provenance --access public
