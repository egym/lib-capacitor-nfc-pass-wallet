name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm:
    name: Package Build (Capacitor ${{ matrix.capacitor-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capacitor-version: ["7.6.8", "8.4.2"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run verify:lockfile
      - run: npm install --no-save --package-lock=false --ignore-scripts "@capacitor/core@$CAPACITOR_VERSION"
        env:
          CAPACITOR_VERSION: ${{ matrix.capacitor-version }}
      - run: npm run build

  android:
    name: Android Build + Test (Capacitor ${{ matrix.capacitor-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capacitor-version: ["7.6.8", "8.4.2"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Configure Android SDK
        run: |
          if [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -n "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            echo "Android SDK not found on runner" >&2
            exit 1
          fi
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon assemble test
        working-directory: android
        env:
          CAPACITOR_VERSION: ${{ matrix.capacitor-version }}

  ios-spm:
    name: iOS SPM Build (Capacitor ${{ matrix.capacitor-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        capacitor-version: ["7.6.8", "8.4.2"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ./scripts/verify-spm-compatibility.sh "$CAPACITOR_VERSION"
        env:
          CAPACITOR_VERSION: ${{ matrix.capacitor-version }}

  ios-cocoapods:
    name: iOS Podspec Validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: pod lib lint CapacitorNFCPassWallet.podspec --allow-warnings
