name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm:
    name: Package Build (Capacitor ${{ matrix.capacitor-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capacitor-version: ["7.6.8", "8.4.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run verify:lockfile
      - run: npm install --no-save --package-lock=false --ignore-scripts "@capacitor/core@$CAPACITOR_VERSION"
        env:
          CAPACITOR_VERSION: ${{ matrix.capacitor-version }}
      - run: npm run build

  android:
    name: Android Build + Test (Capacitor ${{ matrix.capacitor-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capacitor-version: ["7.6.8", "8.4.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Configure Android SDK
        run: |
          if [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -n "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
            echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            echo "Android SDK not found on runner" >&2
            exit 1
          fi
      - run: yes | sdkmanager --licenses
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew --no-daemon assemble test
        working-directory: android
        env:
          CAPACITOR_VERSION: ${{ matrix.capacitor-version }}

  ios-spm:
    name: iOS SPM Build (Capacitor ${{ matrix.capacitor-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        capacitor-version: ["7.6.8", "8.4.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/verify-spm-compatibility.sh "$CAPACITOR_VERSION"
        env:
          CAPACITOR_VERSION: ${{ matrix.capacitor-version }}

  ios-cocoapods:
    name: iOS Podspec Validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pod lib lint CapacitorNFCPassWallet.podspec --allow-warnings
