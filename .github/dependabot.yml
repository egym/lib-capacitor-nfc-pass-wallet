version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    ignore:
      # Gradle 9+ requires a coordinated AGP migration for Capacitor host compatibility.
      - dependency-name: "gradle-wrapper"
        versions: [">=9.0.0"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      gradle-dependencies:
        patterns:
          - "*"
